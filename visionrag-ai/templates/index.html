<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionRAG AI</title><style>body{font-family:system-ui;background:#101827;color:#eef3ff;max-width:850px;margin:55px auto;padding:20px}main{background:#1c293d;padding:32px;border-radius:20px}button{background:#69ddc0;color:#101827;border:0;padding:12px 20px;border-radius:9px;font-weight:700;cursor:pointer}input{padding:12px;margin:12px 0;max-width:100%}#answer{white-space:pre-wrap;line-height:1.6}small{color:#b9c8d9}</style></head><body><main><h1>VisionRAG AI</h1><p>Document intelligence with CNN classification and retrieval-augmented answers.</p><form id="upload"><input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.txt" required><button>Upload</button></form><p id="status"></p><form id="query"><input id="question" placeholder="Ask a question about your document" style="width:65%" required><button>Ask</button></form><h3>Answer & evidence</h3><div id="answer"></div><small>Answers are evidence-grounded. Generative answers require an Ollama server.</small></main><script>let documentId=null;const status=document.getElementById('status'),answer=document.getElementById('answer');document.getElementById('upload').onsubmit=async e=>{e.preventDefault();status.textContent='Processing...';try{const r=await fetch('/api/upload',{method:'POST',body:new FormData(e.target)});const d=await r.json();if(!r.ok)throw Error(d.error);documentId=d.id;status.textContent='Uploaded '+d.filename+' | CNN: '+d.category}catch(err){status.textContent=err.message}};document.getElementById('query').onsubmit=async e=>{e.preventDefault();if(!documentId){answer.textContent='Upload a document first';return}answer.textContent='Searching...';try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:documentId,question:document.getElementById('question').value})});const d=await r.json();if(!r.ok)throw Error(d.error);answer.textContent=(d.answer||d.note)+'\n\n'+d.evidence.map((x,i)=>'Source '+(i+1)+' (similarity '+x.score+'):\n'+x.text).join('\n\n')}catch(err){answer.textContent=err.message}}</script></body></html>
